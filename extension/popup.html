<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackMate Job Capture</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 400px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: #f9fafb;
    }

    .header {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 12px;
      opacity: 0.9;
    }

    .content {
      padding: 20px;
    }

    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status.success {
      background: #d1fae5;
      color: #065f46;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.info {
      background: #dbeafe;
      color: #1e40af;
    }

    .job-data {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
      border: 1px solid #e5e7eb;
    }

    .job-data h3 {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #111827;
    }

    .field {
      margin-bottom: 10px;
    }

    .field label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 4px;
    }

    .field .value {
      font-size: 14px;
      color: #111827;
      word-break: break-word;
    }

    .field .value.empty {
      color: #9ca3af;
      font-style: italic;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: #10b981;
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      background: #059669;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }

    .btn-secondary:hover:not(:disabled) {
      background: #e5e7eb;
    }

    .btn-danger {
      background: #ef4444;
      color: white;
    }

    .btn-danger:hover:not(:disabled) {
      background: #dc2626;
    }

    .screenshot-preview {
      margin-top: 15px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      max-height: 200px;
      display: none;
    }

    .screenshot-preview img {
      width: 100%;
      height: auto;
      display: block;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .settings {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e5e7eb;
    }

    /* Input styles */
    .input-field {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      color: #111827;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    .input-field:focus {
      outline: none;
      border-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.1);
    }

    textarea.input-field {
      min-height: 80px;
      resize: vertical;
    }
  </style>
</head>

<body>
  <div class="header">
    <h1>🎯 TrackMate</h1>
    <p>Capture Job Details</p>
  </div>

  <div class="content">
    <div id="status" class="status info" style="display: none;">
      <span id="statusText">Loading...</span>
    </div>

    <div id="jobData" class="job-data" style="display: none;">
      <h3>Extracted Job Details</h3>
      <div class="field">
        <label>Job Title</label>
        <input type="text" id="position" class="input-field" placeholder="Job Title">
      </div>
      <div class="field">
        <label>Company</label>
        <input type="text" id="company" class="input-field" placeholder="Company Name">
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" id="location" class="input-field" placeholder="Location">
      </div>
      <div style="display: flex; gap: 10px;">
        <div class="field" style="flex: 1;">
          <label>Min Salary</label>
          <input type="number" id="minSalary" class="input-field" placeholder="0">
        </div>
        <div class="field" style="flex: 1;">
          <label>Max Salary</label>
          <input type="number" id="maxSalary" class="input-field" placeholder="0">
        </div>
      </div>
      <div class="field">
        <label>Date Posted</label>
        <input type="text" id="datePosted" class="input-field" placeholder="YYYY-MM-DD or Text">
      </div>
      <div class="field">
        <label>Deadline</label>
        <input type="text" id="deadline" class="input-field" placeholder="YYYY-MM-DD or Text">
      </div>
      <div class="field">
        <label>Description</label>
        <textarea id="description" class="input-field" placeholder="Job Description"></textarea>
      </div>
    </div>

    <!-- Contact Data Section -->
    <div id="contactData" class="job-data" style="display: none;">
      <h3>Extracted Contact Details</h3>
      <div style="text-align: center; margin-bottom: 15px;">
        <img id="contactPhoto" src="" style="width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 2px solid #e5e7eb; background: #f3f4f6;">
      </div>
      <div class="field">
        <label>Name</label>
        <input type="text" id="contactName" class="input-field" placeholder="Full Name">
      </div>
      <div class="field">
        <label>Position</label>
        <input type="text" id="contactPosition" class="input-field" placeholder="Job Position">
      </div>
      <div class="field">
        <label>Company</label>
        <input type="text" id="contactCompany" class="input-field" placeholder="Company">
      </div>
      <div class="field">
        <label>Location</label>
        <input type="text" id="contactLocation" class="input-field" placeholder="Location">
      </div>
      <div class="field">
        <label>Relationship</label>
        <input type="text" id="contactRelationship" class="input-field" placeholder="e.g. Recruiter, Colleague">
      </div>
      <div class="field">
        <label>Notes (About)</label>
        <textarea id="contactNotes" class="input-field" placeholder="About / Notes"></textarea>
      </div>
    </div>

    <div class="screenshot-preview" id="screenshotPreview">
      <img id="screenshotImg" src="" alt="Screenshot">
    </div>

    <div class="actions">
      <button id="extractBtn" class="btn-primary">
        <span>📋 Extract Job Data</span>
      </button>
      <button id="captureBtn" class="btn-secondary">
        <span>📸 Capture Screenshot</span>
      </button>
      <button id="saveBtn" class="btn-primary" style="display: none;">
        <span>💾 Save to TrackMate</span>
      </button>
      <button id="openBtn" class="btn-secondary" style="display: none;">
        <span>🚀 Open TrackMate</span>
      </button>
    </div>

    <div class="settings">
      <label>TrackMate URL:</label>
      <input type="text" id="trackMateUrl" placeholder="http://localhost:8080/trackers"
        value="http://localhost:8080/trackers">
      <div
        style="margin-top: 10px; padding: 8px; background: #fef3c7; border-radius: 6px; font-size: 11px; color: #92400e;">
        ⚠️ <strong>Note:</strong> Make sure you're logged into TrackMate before saving jobs. All jobs are automatically
        associated with your account.
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
